<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Aplicación de Procesamiento de Archivos{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Otros elementos de head -->
        <script src="{{ url_for('static', filename='js/script.js') }}"></script>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
    body {
        background-color: #f2f2f230;
    }
    .btn-cafe-outline {
  /* Estilo por defecto */
  color: #8B4513; /* Color del texto café */
  background-color: transparent; /* Fondo transparente */
  border-color: #8B4513; /* Borde café */
}

.btn-cafe-outline:hover {
  /* Estilo al pasar el ratón */
  color: white; /* Color del texto blanco */
  background-color: #8B4513; /* Fondo café */
  border-color: #8B4513; /* Borde café */
}

    </style>
    
</head>
<body>
    {% include 'navbar.html' %}
    
   
    <div class="container mt-4">
    <!-- Overlay para oscurecer la página -->
    <div id="overlay" class="loading-overlay"></div>
    <div id="loader">
        <div class="loader"></div>
        <h4 >Procesando</h4>
    </div>

        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
