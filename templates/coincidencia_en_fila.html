{% extends 'base.html' %}
{% block title %}Coincidencia en Fila{% endblock %}
{% block content %}
    <div class="container mt-5">
        <h2>Coincidencia en Fila</h2>
        <p class="text-muted">
            Carga un archivo Excel y el sistema devolverá las filas donde
            <strong>ABONADO</strong> y <strong>n° abonado</strong> tengan el mismo valor.
        </p>
        <form id="resultForm" action="{{ url_for('coincidencia_en_fila') }}" method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="archivo_excel" class="form-label">Archivo Excel</label>
                <input type="file" name="archivo_excel" class="form-control" accept=".xlsx,.xls" required>
            </div>
            <button type="submit" class="btn btn-cafe-outline">Procesar Archivo</button>
        </form>
    </div>
{% endblock %}
