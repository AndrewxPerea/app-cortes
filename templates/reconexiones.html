  

    {% extends 'base.html' %}

    {% block title %}Reconexiones{% endblock %}
    {% block content %}



    <div class="container center-screen">
      <div class="row">
        
          <h1>Auditoria de Reconexiones</h1>

          <form id="resultForm" action="/procesar" method="post" enctype="multipart/form-data">
            <div class="input-group mb-3">
              <label class="input-group-text" for="abonados"
                >Archivo de Abonados (Abonados SaePlus)</label
              >
              <input
                type="file"
                class="form-control"
                id="abonados"
                name="abonados"
                placeholder=""
                aria-label=""
              />
            </div>

            <div class="input-group mb-3">
              <label class="input-group-text" for="cortes"
                >Archivo de Cortes(Workdrive):</label
              >
              <input
                type="file"
                class="form-control"
                id="cortes"
                name="cortes"
              />
            </div>
            <br />

            <input
              type="submit"
              class="btn btn-outline-success"
              value="Procesar Archivos"
            />
          </form>

      </div>
    </div>

    </div>
  {% endblock %}
