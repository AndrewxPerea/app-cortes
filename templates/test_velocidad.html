<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Velocidad de Internet</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test de Velocidad de Internet</h1>
        <button onclick="runTest()">Iniciar Test</button>
        <div id="results">
            {% if test_in_progress %}
                <p>Test en progreso...</p>
            {% else %}
                <p>Velocidad de descarga: {{ "%.2f"|format(download_speed) }} Mbps</p>
                <p>Velocidad de subida: {{ "%.2f"|format(upload_speed) }} Mbps</p>
                <p>Ping: {{ "%.2f"|format(ping) }} ms</p>
            {% endif %}
        </div>
    </div>

    <script>
        function runTest() {
            fetch('/run-test')
                .then(response => {
                    document.getElementById('results').innerHTML = '<p>Test en progreso...</p>';
                    checkTestStatus();
                });
        }

        function checkTestStatus() {
            fetch('/test_velocidad')
                .then(response => response.text())
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const results = doc.getElementById('results').innerHTML;
                    document.getElementById('results').innerHTML = results;
                    
                    if (results.includes('Test en progreso')) {
                        setTimeout(checkTestStatus, 1000);
                    }
                });
        }
    </script>
</body>
</html>
